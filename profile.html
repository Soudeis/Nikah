<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mon Profil - NikahConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:linear-gradient(135deg,#ffffff 0%,#fffde7 50%,#fff9c4 100%);min-height:100vh;}

.shell{width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;padding-bottom:100px;}

/* ── Header ── */
.profile-header{position:relative;padding:0 0 24px;}
.cover-bg{height:160px;background:linear-gradient(135deg,#f5c518,#ffe566);position:relative;overflow:hidden;}
.cover-pattern{position:absolute;inset:0;opacity:.15;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:20px 20px;}
.header-actions{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:5;}
.header-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.3);backdrop-filter:blur(10px);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.header-btn svg{width:18px;height:18px;stroke:#fff;}

.avatar-wrap{position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);z-index:5;}
.avatar-ring{width:92px;height:92px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 20px rgba(245,197,24,.3);overflow:hidden;background:#fff;cursor:pointer;position:relative;}
.avatar-ring img{width:100%;height:100%;object-fit:cover;}
.avatar-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;}
.avatar-edit{position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;background:#f5c518;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:12px;}

.profile-name-wrap{margin-top:56px;text-align:center;padding:0 20px;}
.profile-name{font-size:22px;font-weight:800;color:#1a1a1a;}
.profile-sub{font-size:13px;color:#aaa;margin-top:4px;}
.profile-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;}
.ptag{background:linear-gradient(135deg,#fffde7,#fff9c4);border:1px solid rgba(245,197,24,.3);border-radius:20px;padding:5px 12px;font-size:12px;color:#666;font-weight:500;}

.completion-wrap{margin:16px 20px 0;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
.completion-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.completion-label{font-size:12px;font-weight:700;color:#1a1a1a;}
.completion-pct{font-size:12px;font-weight:700;color:#f5c518;}
.completion-bar{height:6px;background:#f5f5f5;border-radius:3px;overflow:hidden;}
.completion-fill{height:100%;background:linear-gradient(90deg,#f5c518,#ffe566);border-radius:3px;transition:width .5s ease;}

/* ── Sections ── */
.section{margin:16px 16px 0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;}
.section-title-row{display:flex;align-items:center;gap:8px;}
.section-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#f5c518,#ffe566);display:flex;align-items:center;justify-content:center;}
.section-icon svg{width:16px;height:16px;stroke:#1a1a1a;}
.section-label{font-size:15px;font-weight:700;color:#1a1a1a;}
.edit-btn{padding:6px 14px;border:1.5px solid rgba(245,197,24,.4);border-radius:20px;background:none;font-size:12px;font-weight:600;color:#f5c518;cursor:pointer;transition:.15s;}
.edit-btn:active{background:rgba(245,197,24,.08);}

/* ── Info rows ── */
.info-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid rgba(245,197,24,.08);}
.info-icon{font-size:18px;flex-shrink:0;width:28px;text-align:center;}
.info-content{flex:1;}
.info-label{font-size:10px;font-weight:700;color:#aaa;letter-spacing:.4px;}
.info-value{font-size:14px;font-weight:600;color:#1a1a1a;margin-top:1px;}
.info-value.empty{color:#ccc;font-weight:400;}

/* ── Photos grid ── */
.photos-section{padding:0 16px 16px;}
.photos-grid-edit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-slot{aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#f9f9f9;border:1.5px dashed #eee;display:flex;align-items:center;justify-content:center;transition:.2s;}
.photo-slot:hover{border-color:#f5c518;}
.photo-slot img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-slot .add-icon{font-size:22px;color:#ddd;}
.photo-slot .remove-btn{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
.photo-slot .main-badge{position:absolute;bottom:5px;left:5px;background:#f5c518;color:#1a1a1a;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;}

/* ── Edit modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:0 0 30px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:36px;height:4px;background:#eee;border-radius:2px;margin:12px auto 0;}
.modal-title{font-size:16px;font-weight:700;color:#1a1a1a;text-align:center;padding:16px 0 8px;}
.modal-body{padding:0 20px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:11px;font-weight:700;color:#aaa;letter-spacing:.4px;margin-bottom:6px;}
.form-group input,
.form-group select,
.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid #eee;border-radius:12px;font-size:15px;color:#1a1a1a;background:#fafafa;outline:none;transition:.2s;font-family:inherit;}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{border-color:#f5c518;background:#fff;box-shadow:0 0 0 3px rgba(245,197,24,.1);}
.form-group textarea{resize:none;height:90px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;gap:10px;padding:16px 20px 0;}
.btn-cancel{flex:1;padding:13px;border:1.5px solid #eee;border-radius:12px;background:#fff;font-size:15px;font-weight:600;color:#999;cursor:pointer;}
.btn-save{flex:2;padding:13px;border:none;border-radius:12px;background:linear-gradient(135deg,#f5c518,#ffe566);font-size:15px;font-weight:700;color:#1a1a1a;cursor:pointer;box-shadow:0 4px 12px rgba(245,197,24,.35);}
.btn-save:active{transform:scale(.98);}

/* ── Settings items ── */
.settings-item{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid rgba(245,197,24,.08);cursor:pointer;transition:background .15s;}
.settings-item:active{background:rgba(245,197,24,.05);}
.settings-item-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.settings-item-icon svg{width:18px;height:18px;}
.settings-item-label{flex:1;font-size:14px;font-weight:600;color:#1a1a1a;}
.settings-item-arrow{color:#ddd;font-size:16px;}
.settings-item.danger .settings-item-label{color:#f87171;}

/* ── Toast ── */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;white-space:nowrap;}

/* ── Navbar ── */
.navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;padding:10px 0 20px;border-top:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.92);backdrop-filter:blur(20px);z-index:100;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;}
.nav-item svg{width:24px;height:24px;stroke:#ccc;}
.nav-item.active svg{stroke:#f5c518;}
.nav-label{font-size:10px;color:#ccc;font-weight:600;}
.nav-item.active .nav-label{color:#f5c518;}

/* ── Spinner ── */
.spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:#f5c518;border-radius:50%;animation:spin 1s linear infinite;margin:40px auto;display:block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>
const API = "https://monbackend.duckdns.org";
let me = JSON.parse(localStorage.getItem('me'));
if(!me) window.location.href = 'index.html';

let editPhotos       = [];
let currentPhotoSlot = 0;
const COLORS = ['#f5c518','#e8547a','#9b59b6','#3498db','#2ecc71','#e67e22'];
function colorFor(id){ return COLORS[Math.abs(parseInt(id||0)) % COLORS.length]; }

// ════════════════════════════════
// RENDER PROFIL
// ════════════════════════════════
function renderProfile(){
  const photos = me.photos || [];

  // Avatar
  const ring = document.getElementById('avatar-ring');
  const ph   = document.getElementById('avatar-ph');
  if(photos[0]){
    ring.innerHTML = `<img src="${photos[0]}" alt=""/>`;
  } else {
    const init = ((me.prenom||'?')[0]+((me.nom||'?')[0])).toUpperCase();
    ph.textContent  = init;
    ph.style.background = colorFor(me.id);
  }

  // Nom
  document.getElementById('profile-name').textContent =
    `${me.prenom||''} ${me.nom||''}`.trim() || 'Mon profil';
  document.getElementById('profile-sub').textContent =
    [me.ville, me.pays].filter(Boolean).join(', ') || 'Localisation non renseignée';

  // Tags
  const tags = [me.religion, me.profession, me.niveau_etudes].filter(Boolean);
  document.getElementById('profile-tags').innerHTML =
    tags.map(t=>`<div class="ptag">${t}</div>`).join('');

  // Photos preview
  const grid = document.getElementById('photos-preview');
  grid.innerHTML = '';
  for(let i=0;i<6;i++){
    const slot = document.createElement('div');
    slot.className = 'photo-slot';
    if(photos[i]){
      slot.innerHTML = `
        <img src="${photos[i]}" alt=""/>
        ${i===0?`<div class="main-badge">Principale</div>`:''}`;
    } else {
      slot.innerHTML = `<span class="add-icon">+</span>`;
      slot.onclick = () => openEditModal('photos');
    }
    grid.appendChild(slot);
  }

  // Infos rows
  const infos = [
    {icon:'🎂', label:'Âge',        value: me.age ? me.age+' ans' : null},
    {icon:'⚧',  label:'Genre',      value: me.genre},
    {icon:'📍', label:'Ville',      value: me.ville},
    {icon:'🌍', label:'Pays',       value: me.pays},
    {icon:'💼', label:'Profession', value: me.profession},
    {icon:'🕌', label:'Religion',   value: me.religion},
    {icon:'🎓', label:'Études',     value: me.niveau_etudes},
    {icon:'🔍', label:'Recherche',  value: me.recherche},
  ];
  document.getElementById('infos-rows').innerHTML = infos.map(info=>`
    <div class="info-row">
      <div class="info-icon">${info.icon}</div>
      <div class="info-content">
        <div class="info-label">${info.label.toUpperCase()}</div>
        <div class="info-value ${!info.value?'empty':''}">${info.value||'Non renseigné'}</div>
      </div>
    </div>`).join('');

  // Description
  document.getElementById('desc-text').textContent =
    me.description || 'Aucune description pour l\'instant. Parlez de vous !';
  if(!me.description)
    document.getElementById('desc-text').style.color='#ccc';

  // Complétion
  const fields = [me.prenom, me.nom, me.age, me.ville, me.pays, me.profession,
                  me.religion, me.niveau_etudes, me.description, me.genre,
                  photos.length>0 ? 'ok' : null, photos.length>1 ? 'ok' : null];
  const filled = fields.filter(Boolean).length;
  const pct    = Math.round((filled/fields.length)*100);
  document.getElementById('completion-pct').textContent  = pct+'%';
  document.getElementById('completion-fill').style.width = pct+'%';
}

// ════════════════════════════════
// AVATAR
// ════════════════════════════════
function pickAvatar(){ document.getElementById('avatar-input').click(); }

async function handleAvatarUpload(input){
  if(!input.files[0]) return;
  const fd = new FormData(); fd.append('file', input.files[0]);
  try{
    const res  = await fetch(`${API}/upload-photo`, {method:'POST', body:fd});
    const data = await res.json();
    const photos = [...(me.photos||[])];
    photos[0] = data.url;
    await saveProfile({photos});
    showToast('Photo principale mise à jour ✓');
  }catch(e){ showToast('Erreur upload'); }
  input.value='';
}

// ════════════════════════════════
// MODAL
// ════════════════════════════════
function openEditModal(type){
  const overlay = document.getElementById('modal-overlay');
  const title   = document.getElementById('modal-title');
  const body    = document.getElementById('modal-body');
  overlay.classList.add('show');

  if(type==='infos'){
    title.textContent = 'Modifier mes infos';
    body.innerHTML = `
      <div class="row2">
        <div class="form-group"><label>PRÉNOM</label>
          <input id="e-prenom" value="${me.prenom||''}"/></div>
        <div class="form-group"><label>NOM</label>
          <input id="e-nom" value="${me.nom||''}"/></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>ÂGE</label>
          <input type="number" id="e-age" value="${me.age||''}" min="18" max="80"/></div>
        <div class="form-group"><label>GENRE</label>
          <select id="e-genre">
            <option value="">Choisir</option>
            <option value="homme" ${me.genre==='homme'?'selected':''}>Homme</option>
            <option value="femme" ${me.genre==='femme'?'selected':''}>Femme</option>
          </select></div>
      </div>
      <div class="row2">
        <div class="form-group"><label>VILLE</label>
          <input id="e-ville" value="${me.ville||''}"/></div>
        <div class="form-group"><label>PAYS</label>
          <input id="e-pays" value="${me.pays||''}"/></div>
      </div>
      <div class="form-group"><label>PROFESSION</label>
        <input id="e-profession" value="${me.profession||''}"/></div>
      <div class="row2">
        <div class="form-group"><label>RELIGION</label>
          <select id="e-religion">
            <option value="">Choisir</option>
            <option value="Islam"         ${me.religion==='Islam'?'selected':''}>Islam</option>
            <option value="Christianisme" ${me.religion==='Christianisme'?'selected':''}>Christianisme</option>
            <option value="Judaïsme"      ${me.religion==='Judaïsme'?'selected':''}>Judaïsme</option>
            <option value="Autre"         ${me.religion==='Autre'?'selected':''}>Autre</option>
          </select></div>
        <div class="form-group"><label>ÉTUDES</label>
          <select id="e-etudes">
            <option value="">Choisir</option>
            <option value="Bac"    ${me.niveau_etudes==='Bac'?'selected':''}>Bac</option>
            <option value="Bac+2"  ${me.niveau_etudes==='Bac+2'?'selected':''}>Bac+2</option>
            <option value="Bac+3"  ${me.niveau_etudes==='Bac+3'?'selected':''}>Bac+3</option>
            <option value="Bac+5"  ${me.niveau_etudes==='Bac+5'?'selected':''}>Bac+5</option>
            <option value="Doctorat" ${me.niveau_etudes==='Doctorat'?'selected':''}>Doctorat</option>
          </select></div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save"   onclick="saveInfos()">Enregistrer</button>
      </div>`;
  }
else if(type==='settings'){
    title.textContent = 'Paramètres du compte';
    body.innerHTML = `
      <p style="font-size:13px;color:#aaa;text-align:center;margin-bottom:14px;">
        Choisissez une option à modifier :
      </p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn-save" style="background:#fff; border:1.5px solid #eee; color:#1a1a1a; box-shadow:none;" onclick="openEditModal('password')"> Changer le mot de passe</button>
        <button class="btn-save" style="background:#fff; border:1.5px solid #eee; color:#1a1a1a; box-shadow:none;" onclick="openEditModal('preferences')"> Préférences de recherche</button>
      </div>
      <div class="modal-actions" style="padding:16px 0 0;">
        <button class="btn-cancel" style="width:100%;" onclick="closeModal()">Fermer</button>
      </div>`;
  }
  else if(type==='description'){
    title.textContent = 'Ma description';
    body.innerHTML = `
      <div class="form-group">
        <label>À PROPOS DE MOI</label>
        <textarea id="e-desc" style="height:140px;">${me.description||''}</textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save"   onclick="saveDescription()">Enregistrer</button>
      </div>`;
  }

  else if(type==='photos'){
    title.textContent = 'Mes photos';
    editPhotos = [...(me.photos||[])];
    body.innerHTML = `
      <p style="font-size:13px;color:#aaa;text-align:center;margin-bottom:14px;">
        La première photo est votre photo principale
      </p>
      <div id="edit-photos-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save"   onclick="savePhotos()">Enregistrer</button>
      </div>`;
    renderEditPhotos();
  }

  else if(type==='password'){
    title.textContent = 'Changer le mot de passe';
    body.innerHTML = `
      <div class="form-group"><label>ANCIEN MOT DE PASSE</label>
        <input type="password" id="e-oldpw" placeholder="••••••••"/></div>
      <div class="form-group"><label>NOUVEAU MOT DE PASSE</label>
        <input type="password" id="e-newpw" placeholder="Minimum 6 caractères"/></div>
      <div class="form-group"><label>CONFIRMER</label>
        <input type="password" id="e-confirmpw" placeholder="••••••••"/></div>
      <div id="pw-error" style="color:#f87171;font-size:13px;margin-bottom:8px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save"   onclick="savePassword()">Enregistrer</button>
      </div>`;
  }

  else if(type==='preferences'){
    title.textContent = 'Préférences de recherche';
    body.innerHTML = `
      <div class="form-group"><label>JE RECHERCHE</label>
        <select id="e-recherche">
          
          <option value="homme" ${me.recherche==='homme'?'selected':''}>Un homme</option>
          <option value="femme" ${me.recherche==='femme'?'selected':''}>Une femme</option>
          
        </select></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save"   onclick="savePreferences()">Enregistrer</button>
      </div>`;
  }
}

function closeModal(event){
  if(event && event.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('show');
}

// ════════════════════════════════
// PHOTOS EDIT
// ════════════════════════════════
function renderEditPhotos(){
  const grid = document.getElementById('edit-photos-grid');
  if(!grid) return;
  grid.innerHTML='';
  for(let i=0;i<6;i++){
    const slot=document.createElement('div');
    slot.className='photo-slot';
    slot.style.cssText='aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#f9f9f9;border:1.5px dashed #eee;display:flex;align-items:center;justify-content:center;';
    if(editPhotos[i]){
      slot.innerHTML=`
        <img src="${editPhotos[i]}" style="width:100%;height:100%;object-fit:cover;"/>
        ${i===0?`<div style="position:absolute;bottom:5px;left:5px;background:#f5c518;color:#1a1a1a;font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px;">Principale</div>`:''}
        <button onclick="removeEditPhoto(event,${i})" style="position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;">×</button>`;
    } else {
      slot.innerHTML=`<span style="font-size:22px;color:#ddd;">+</span>`;
      slot.onclick=()=>pickEditPhoto(i);
    }
    grid.appendChild(slot);
  }
}
function pickEditPhoto(idx){
  currentPhotoSlot=idx;
  document.getElementById('photo-input').click();
}
async function handlePhotoUpload(input){
  if(!input.files[0]) return;
  const fd=new FormData(); fd.append('file',input.files[0]);
  try{
    const res=await fetch(`${API}/upload-photo`,{method:'POST',body:fd});
    const data=await res.json();
    editPhotos[currentPhotoSlot]=data.url;
    renderEditPhotos();
  }catch(e){ showToast('Erreur upload'); }
  input.value='';
}
function removeEditPhoto(event, idx){
  event.stopPropagation();
  editPhotos.splice(idx,1);
  renderEditPhotos();
}

// ════════════════════════════════
// SAVE
// ════════════════════════════════
async function saveProfile(fields){
  try{
    const res  = await fetch(`${API}/update-profile`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id:me.id, ...fields})
    });
    const data = await res.json();
    if(data.ok){
      me = {...me, ...fields, ...data.user};
      localStorage.setItem('me', JSON.stringify(me));
      renderProfile();
      return true;
    }
  }catch(e){}
  return false;
}

async function saveInfos(){
  const fields={
    prenom:        document.getElementById('e-prenom').value.trim(),
    nom:           document.getElementById('e-nom').value.trim(),
    age:           parseInt(document.getElementById('e-age').value)||null,
    genre:         document.getElementById('e-genre').value,
    ville:         document.getElementById('e-ville').value.trim(),
    pays:          document.getElementById('e-pays').value.trim(),
    profession:    document.getElementById('e-profession').value.trim(),
    religion:      document.getElementById('e-religion').value,
    niveau_etudes: document.getElementById('e-etudes').value,
  };
  const ok = await saveProfile(fields);
  if(ok){ closeModal(); showToast('Profil mis à jour ✓'); }
  else    showToast('Erreur lors de la mise à jour');
}

async function saveDescription(){
  const desc = document.getElementById('e-desc').value.trim();
  const ok   = await saveProfile({description:desc});
  if(ok){ closeModal(); showToast('Description mise à jour ✓'); }
}

async function savePhotos(){
  const photos = editPhotos.filter(Boolean);
  if(!photos.length){ showToast('Ajoutez au moins une photo'); return; }
  const ok = await saveProfile({photos});
  if(ok){ closeModal(); showToast('Photos mises à jour ✓'); }
}

async function savePassword(){
  const oldpw  = document.getElementById('e-oldpw').value.trim();
  const newpw  = document.getElementById('e-newpw').value.trim();
  const confirmpw = document.getElementById('e-confirmpw').value.trim();
  const errEl  = document.getElementById('pw-error');
  if(!oldpw||!newpw){ errEl.textContent='Remplissez tous les champs'; errEl.style.display='block'; return; }
  if(newpw.length<6){ errEl.textContent='Minimum 6 caractères'; errEl.style.display='block'; return; }
  if(newpw!==confirmpw){ errEl.textContent='Les mots de passe ne correspondent pas'; errEl.style.display='block'; return; }
  try{
    const res  = await fetch(`${API}/update-password`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user_id:me.id, old_password:oldpw, new_password:newpw})
    });
    const data = await res.json();
    if(data.ok){ closeModal(); showToast('Mot de passe mis à jour ✓'); }
    else{ errEl.textContent=data.msg||'Ancien mot de passe incorrect'; errEl.style.display='block'; }
  }catch(e){ errEl.textContent='Erreur réseau'; errEl.style.display='block'; }
}

async function savePreferences(){
  const recherche = document.getElementById('e-recherche').value;
  const ok = await saveProfile({recherche});
  if(ok){ closeModal(); showToast('Préférences mises à jour ✓'); }
}

// ════════════════════════════════
// LOGOUT
// ════════════════════════════════
function doLogout(){
  if(!confirm('Se déconnecter ?')) return;
  localStorage.clear();
  window.location.href='index.html';
}

function showToast(msg){
  document.getElementById('toast-el')?.remove();
  const t=document.createElement('div'); t.id='toast-el';
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// ── Init ──
renderProfile();
</script>
