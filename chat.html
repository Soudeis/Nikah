<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:linear-gradient(135deg,#ffffff 0%,#fffde7 50%,#fff9c4 100%);}

.shell{width:100%;max-width:480px;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#ffffff 0%,#fffde7 50%,#fffbea 100%);position:relative;overflow:hidden;}

.topbar{position:relative;z-index:10;padding:12px 16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(245,197,24,.2);flex-shrink:0;}
.back{cursor:pointer;font-size:20px;background:none;border:none;color:#1a1a1a;padding:4px 8px 4px 0;}
.topbar-info{flex:1;min-width:0;}
.topbar-info h2{margin:0;font-size:15px;font-weight:700;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar-sub{font-size:11px;color:#aaa;}

.messages-area{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:4px;position:relative;z-index:1;}
.messages-area::-webkit-scrollbar{width:2px;}
.messages-area::-webkit-scrollbar-thumb{background:rgba(245,197,24,.3);border-radius:2px;}

.bubble-wrapper{display:flex;flex-direction:column;margin-bottom:4px;}
.bubble-wrapper.me{align-items:flex-end;}
.bubble-wrapper.them{align-items:flex-start;}

.bubble{max-width:78%;padding:10px 14px;border-radius:22px;font-size:15px;line-height:1.45;word-break:break-word;cursor:pointer;user-select:none;}
.bubble.me{background:linear-gradient(135deg,#f5c518,#ffe566);color:#1a1a1a;border-bottom-right-radius:6px;box-shadow:0 2px 8px rgba(245,197,24,.3);}
.bubble.them{background:#fff;color:#1a1a1a;border-bottom-left-radius:6px;border:1px solid rgba(245,197,24,.2);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.bubble.sticker-bubble{background:transparent!important;border:none!important;padding:4px!important;box-shadow:none!important;}

.forwarded-label{font-size:11px;opacity:.6;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.bubble-time{font-size:10px;margin-top:4px;opacity:.5;text-align:right;color:#666;display:flex;align-items:center;justify-content:flex-end;gap:4px;}
.edited-tag{font-size:9px;font-style:italic;color:rgba(0,0,0,.4);}
.seen-label{text-align:right;font-size:10px;color:#f5c518;margin-top:2px;padding-right:4px;font-weight:600;}

.reactions-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.reaction-pill{display:flex;align-items:center;gap:3px;background:rgba(245,197,24,.12);border:1px solid rgba(245,197,24,.25);border-radius:20px;padding:3px 8px;font-size:13px;cursor:pointer;transition:.15s;user-select:none;}
.reaction-pill.mine{background:rgba(245,197,24,.3);border-color:#f5c518;}
.reaction-pill:active{transform:scale(.92);}
.reaction-count{font-size:11px;color:#666;font-weight:600;}

.reply-preview{border-left:3px solid #f5c518;padding:4px 8px;margin-bottom:6px;border-radius:4px;background:rgba(245,197,24,.08);font-size:11px;cursor:pointer;overflow:hidden;}
.reply-preview-name{font-weight:700;font-size:10px;margin-bottom:1px;color:#f5c518;}
.reply-preview-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7;color:#333;}

/* ══ VOCAL PLAYER ══ */
.vocal-player{
  display:flex;align-items:center;gap:10px;
  min-width:210px;max-width:260px;padding:4px 0;
}
.vocal-play-btn{
  width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(0,0,0,.12);color:#1a1a1a;font-size:14px;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;transition:.15s;
}
.bubble.them .vocal-play-btn{background:rgba(245,197,24,.3);}
.vocal-play-btn:active{transform:scale(.92);}
.vocal-waveform{
  flex:1;height:40px;display:flex;align-items:center;
  gap:2px;cursor:pointer;overflow:hidden;
}
/* Les barres utilisent px pas % */
.vocal-bar{
  flex:1;border-radius:3px;
  background:rgba(0,0,0,.15);
  transition:background .1s;
  min-width:2px;
}
.bubble.them .vocal-bar{background:rgba(245,197,24,.4);}
.bubble.me   .vocal-bar.played{background:rgba(0,0,0,.6);}
.bubble.them .vocal-bar.played{background:#d4a017;}
.bubble.me   .vocal-bar.active{background:#1a1a1a;}
.bubble.them .vocal-bar.active{background:#b8860b;}
.vocal-duration{font-size:11px;opacity:.6;flex-shrink:0;min-width:32px;text-align:right;color:#333;}

.media-card-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:50px;cursor:pointer;transition:.15s;user-select:none;}
.media-card-btn.me{background:rgba(255,255,255,.4);}
.media-card-btn.them{background:rgba(245,197,24,.15);}
.media-card-btn:active{transform:scale(.96);}
.media-card-play{width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.media-card-play svg{width:12px;height:12px;fill:#1a1a1a;margin-left:2px;}
.media-card-label{font-size:15px;font-weight:700;color:#1a1a1a;}

.typing-bubble{display:flex;gap:4px;align-items:center;padding:10px 14px;background:#fff;border-radius:22px;border-bottom-left-radius:6px;align-self:flex-start;border:1px solid rgba(245,197,24,.2);}
.dot{width:6px;height:6px;border-radius:50%;background:#f5c518;animation:bonce .9s infinite;}
.dot:nth-child(2){animation-delay:.2s;}
.dot:nth-child(3){animation-delay:.4s;}
@keyframes bonce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

.reply-bar{display:none;padding:8px 14px;background:rgba(255,255,255,.9);border-top:2px solid rgba(245,197,24,.3);flex-direction:row;align-items:center;gap:10px;flex-shrink:0;position:relative;z-index:10;}
.reply-bar.active{display:flex;}
.reply-bar-name{font-size:11px;font-weight:700;color:#f5c518;}
.reply-bar-text{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reply-bar-cancel{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;}

/* ══ RECORDING BAR ══ */
.vocal-recording-bar{display:none;padding:12px 16px;background:linear-gradient(135deg,#f5c518,#ffe566);flex-direction:row;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:10;border-radius:40px;margin:8px 12px;}
.vocal-recording-bar.active{display:flex;}
.rec-pause-btn{width:38px;height:38px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;color:#f5c518;font-weight:700;}
.rec-waveform{flex:1;height:36px;display:flex;align-items:center;gap:2px;overflow:hidden;cursor:pointer;}
.rec-bar{width:3px;border-radius:3px;background:rgba(0,0,0,.3);min-height:4px;flex-shrink:0;}
.rec-timer-text{font-size:14px;font-weight:700;color:#1a1a1a;flex-shrink:0;min-width:36px;text-align:right;}

.vocal-recording-actions{display:none;padding:0 16px 12px;flex-direction:row;align-items:center;justify-content:space-between;flex-shrink:0;position:relative;z-index:10;}
.vocal-recording-actions.active{display:flex;}
.rec-delete-btn{width:44px;height:44px;border-radius:50%;background:none;border:none;color:#aaa;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;}
.rec-send-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#f5c518,#ffe566);border:none;cursor:pointer;color:#1a1a1a;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(245,197,24,.5);}

.input-row{padding:10px 12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(245,197,24,.15);flex-shrink:0;position:relative;z-index:10;}

.upload-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#1a1a1a;font-size:15px;}

.upload-spinner{width:40px;height:40px;border:3px solid rgba(245,197,24,.2);border-top-color:#f5c518;border-radius:50%;animation:spin 1s linear infinite;}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:400;white-space:nowrap;border:1px solid rgba(245,197,24,.3);}
  .sticker-panel{

.sticker-search-bar{margin:10px 14px 8px;background:rgba(0,0,0,.05);border-radius:12px;display:flex;align-items:center;gap:8px;padding:8px 12px;flex-shrink:0;}
.sticker-search-bar svg{width:16px;height:16px;flex-shrink:0;opacity:.4;}
.sticker-search-input{background:none;border:none;outline:none;font-size:14px;color:#1a1a1a;flex:1;}

<script>
// Remplace par ton vrai sous-domaine en HTTPS et SANS le port 8000
const API = "https://monbackend.duckdns.org";
const WS_URL   = "wss://monbackend.duckdns.org/ws";
const EDIT_LIMIT_MS = 7 * 60 * 1000;
const QUICK_EMOJIS  = ['❤️','😂','😮','😢','😡','👍'];
const BAR_COUNT     = 30;

const me     = JSON.parse(localStorage.getItem('me'));
const friend = JSON.parse(localStorage.getItem('currentFriend'));
if(!me || !friend) window.location.href = 'matches.html';

document.getElementById('chat-name').textContent = `${friend.prenom} ${friend.nom||''}`.trim();

const avatarTop = document.getElementById('friend-avatar-top');
const COLORS = ['#f5c518','#e8547a','#9b59b6','#3498db','#2ecc71','#e67e22'];
const color  = COLORS[Math.abs(parseInt(friend.id||0)) % COLORS.length];
const init   = ((friend.prenom||'?')[0]+((friend.nom||'?')[0])).toUpperCase();
if(friend.photo || friend.photos?.[0]){
  avatarTop.innerHTML=`<img src="${friend.photo||friend.photos[0]}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #f5c518;"/>`;
} else {
  avatarTop.innerHTML=`<div style="width:36px;height:36px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;">${init}</div>`;
}

let messages=[], ws=null, seen=false, typingTimer=null, isTypingSent=false;
let replyingTo=null, editingMsgId=null;

// ════════════════════════════════════════════
// WAVEFORM — génère des barres stables en PX
// ════════════════════════════════════════════
function generateWaveBars(seed, count){
  let hash = 0;
  for(let i=0; i<seed.length; i++){
    hash = Math.imul(31, hash) + seed.charCodeAt(i) | 0;
  }
  const bars = [];
  for(let i=0; i<count; i++){
    // Mélange de sinus + hash déterministe → toujours identique pour le même seed
    const sine    = Math.sin(i * 0.8 + (hash & 0xff) * 0.02) * 10;
    const sine2   = Math.sin(i * 0.3 + ((hash >> 8) & 0xff) * 0.04) * 6;
    const hVal    = Math.abs(Math.imul(hash ^ (i * 2246822519), 2654435761)) >>> 0;
    const pseudo  = (hVal % 12);
    const h       = Math.round(Math.max(4, Math.min(28, 14 + sine + sine2 + pseudo)));
    bars.push(h); // en PX
  }
  return bars;
}

// Stockage des barres par uid pour ne pas recalculer
const waveCache = {};
function getBars(uid){
  if(!waveCache[uid]) waveCache[uid] = generateWaveBars(String(uid), BAR_COUNT);
  return waveCache[uid];
}

async function loadGiphyStickers(cat){

      ?`https://api.giphy.com/v1/stickers/trending?api_key=${GIPHY_KEY}&limit=18&rating=g`
      :`https://api.giphy.com/v1/stickers/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(cat.query)}&limit=18&rating=g`;
    const res=await fetch(url);

function renderGiphyGrid(stickers){

      <img src="${url}" alt="sticker" loading="lazy" onload="this.style.opacity=1" style="opacity:0;transition:opacity .2s;"/>

// WEBSOCKET
// ════════════════════════════════════════════
function connectWS(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    ws.send(JSON.stringify({user_id: me.id}));
    ws.send(JSON.stringify({action:'get_history', to: friend.id}));
    ws.send(JSON.stringify({action:'mark_read',   to: friend.id}));
  };
  ws.onmessage = e => {
    const data = JSON.parse(e.data);
    if(data.action==='history'){
      messages = (data.messages||[]).map(m=>({
        from: String(m.from!==undefined?m.from:m.from_user),
        text: m.text||'', media_url: m.media_url||null, media_type: m.media_type||null,
        is_vocal: m.is_vocal||false, time: m.time, msg_id: m.msg_id,
        edited: m.edited===1||m.edited===true, created_at: m.created_at||null,
        is_forwarded: m.is_forwarded===1||m.is_forwarded===true,
        forwarded_from: m.forwarded_from||null,
        reply_to_id: m.reply_to_id||null, reply_to_text: m.reply_to_text||null,
        reply_to_type: m.reply_to_type||null, reply_to_from: m.reply_to_from||null,
        reactions: m.reactions||[],
      }));
      renderMessages();
    }
    else if(data.action==='new_message' && String(data.from)===String(friend.id)){
      messages.push({
        from: String(data.from), text: data.text||'',
        media_url: data.media_url||null, media_type: data.media_type||null,
        is_vocal: data.is_vocal||false, time: data.time, msg_id: data.msg_id,
        edited: false, created_at: data.created_at||null,
        is_forwarded: data.is_forwarded||false, forwarded_from: data.forwarded_from||null,
        reply_to_id: data.reply_to_id||null, reply_to_text: data.reply_to_text||null,
        reply_to_type: data.reply_to_type||null, reply_to_from: data.reply_to_from||null,
        reactions:[],
      });
      renderMessages();
      ws.send(JSON.stringify({action:'mark_read', to: friend.id}));
    }
    else if(data.action==='typing' && String(data.from)===String(friend.id)){
      showTyping(data.is_typing);
    }
    else if(data.action==='seen'){ seen=true; renderMessages(); }
    else if(data.action==='message_deleted'){
      messages = messages.filter(m=>m.msg_id!==data.msg_id); renderMessages();
    }
    else if(data.action==='message_edited'){
      const m = messages.find(m=>m.msg_id===data.msg_id);
      if(m){ m.text=data.text; m.edited=true; renderMessages(); }
    }
    else if(data.action==='edit_error'){ showToast(data.msg||'Modification impossible'); cancelEdit(); }
    else if(data.action==='message_reaction'){
      const m = messages.find(m=>m.msg_id===data.msg_id);
      if(m){
        m.reactions = m.reactions.filter(r=>r.user_id!==String(data.user_id));
        m.reactions.push({emoji:data.emoji, user_id:String(data.user_id)});
        renderMessages();
      }
    }
    else if(data.action==='reaction_removed'){
      const m = messages.find(m=>m.msg_id===data.msg_id);
      if(m){
        m.reactions = m.reactions.filter(r=>!(r.user_id===String(data.user_id)&&r.emoji===data.emoji));
        renderMessages();
      }
    }
    else if(data.action==='message_sent'){
      const m = messages.find(m=>m.msg_id===data.temp_id);
      if(m){
        // Migrer le cache de barres vers le nouvel ID
        if(waveCache[data.temp_id]){
          waveCache[data.msg_id] = waveCache[data.temp_id];
          delete waveCache[data.temp_id];
        }
        m.msg_id     = data.msg_id;
        m.created_at = data.created_at;
        m.time       = data.time;
      }
    }
  };
  ws.onclose = () => setTimeout(connectWS, 3000);
}

// RENDER
// ════════════════════════════════════════════
function renderMessages(){
  const area = document.getElementById('messages-area');
  let lastMineIdx = -1;
  for(let i=messages.length-1;i>=0;i--){
    if(String(messages[i].from)===String(me.id)){ lastMineIdx=i; break; }
  }
  area.innerHTML = messages.map((m,i)=>{
    const isMe      = String(m.from)===String(me.id);
    const showSeen  = isMe && i===lastMineIdx && seen;
    const isSticker = m.media_type==='sticker';
    const replyHTML = m.reply_to_id ? buildReplyPreview(m) : '';
    const content   = buildContent(m, isMe);
    const editedTag = m.edited ? `<span class="edited-tag">· modifié</span>` : '';
    const fwdLabel  = m.is_forwarded ? `<div class="forwarded-label">↪ Transféré</div>` : '';
    const reactionsHTML = buildReactionsHTML(m, isMe);
    return `
      <div class="bubble-wrapper ${isMe?'me':'them'}">
        <div class="bubble ${isMe?'me':'them'}${isSticker?' sticker-bubble':''}" id="msg_${m.msg_id}"
          oncontextmenu="openMenu(event,${i})"
          ontouchstart="touchStart(event,${i})"
          ontouchend="touchEnd()">
          ${fwdLabel}${replyHTML}${content}
          ${!isSticker?`<div class="bubble-time">${m.time||''}${editedTag}</div>`:''}
        </div>
        ${reactionsHTML}
        ${isSticker?`<div style="font-size:10px;color:#aaa;margin-top:2px;${isMe?'text-align:right':'text-align:left'}">${m.time||''}</div>`:''}
        ${showSeen?`<div class="seen-label">Vu ✓</div>`:''}
      </div>`;
  }).join('');
  area.scrollTop = area.scrollHeight;

  // Seek par clic sur waveform
  document.querySelectorAll('.vocal-waveform').forEach(el=>{
    el.addEventListener('click', e=>{
      const uid   = el.dataset.uid;
      const audio = document.getElementById('audio_'+uid);
      if(!audio||!audio.duration) return;
      const rect = el.getBoundingClientRect();
      audio.currentTime = ((e.clientX-rect.left)/rect.width)*audio.duration;
    });
  });
}

function buildReactionsHTML(m, isMe){
  if(!m.reactions||!m.reactions.length) return '';
  const groups = {};
  m.reactions.forEach(r=>{
    if(!groups[r.emoji]) groups[r.emoji]={count:0,mine:false};
    groups[r.emoji].count++;
    if(r.user_id===String(me.id)) groups[r.emoji].mine=true;
  });
  const pills = Object.entries(groups).map(([emoji,g])=>
    `<div class="reaction-pill${g.mine?' mine':''}" onclick="toggleReaction('${m.msg_id}','${emoji}')">
      <span>${emoji}</span>
      ${g.count>1?`<span class="reaction-count">${g.count}</span>`:''}
    </div>`
  ).join('');
  return `<div class="reactions-row" style="${isMe?'justify-content:flex-end':'justify-content:flex-start'}">${pills}</div>`;
}

function buildContent(m, isMe){
  if(m.media_type==='sticker'){
    return `<img src="${m.media_url}" alt="sticker" style="width:140px;height:140px;object-fit:contain;display:block;" loading="lazy"/>`;
  }
  if(m.media_type==='image'){
    const mJson = encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card-btn ${isMe?'me':'them'}" onclick="openViewer('${mJson}')">
      <div class="media-card-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <span class="media-card-label">Photo</span></div>`;
  }
  if(m.media_type==='video'){
    const mJson = encodeURIComponent(JSON.stringify(m));
    return `<div class="media-card-btn ${isMe?'me':'them'}" onclick="openViewer('${mJson}')">
      <div class="media-card-play"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>
      <span class="media-card-label">Vidéo</span></div>`;
  }
  if(m.media_type==='audio'){
    const uid  = String(m.msg_id || Date.now());
    const bars = getBars(uid); // toujours les mêmes pour ce uid
    const barsHTML = bars.map(h =>
  `<div class="vocal-bar" data-h="${h}" style="height:${h}px;"></div>`
).join('');
    return `
      <div class="vocal-player">
        <button class="vocal-play-btn" onclick="toggleVocal('${uid}')">▶</button>
        <audio id="audio_${uid}" src="${m.media_url}" preload="auto"
          ontimeupdate="updateVocalBar('${uid}')"
          onended="resetVocal('${uid}')"></audio>
        <div class="vocal-waveform" data-uid="${uid}">${barsHTML}</div>
        <span class="vocal-duration" id="dur_${uid}">0:00</span>
      </div>`;
  }
  return `<span>${m.text}</span>`;
}

// ════════════════════════════════════════════
// AUDIO PLAYER
// ════════════════════════════════════════════
function toggleVocal(uid){
  const audio = document.getElementById('audio_'+uid);
  const btn   = audio?.previousElementSibling;
  if(!audio) return;
  if(audio.paused){
    document.querySelectorAll('audio').forEach(a=>{
      if(a!==audio){ a.pause(); resetVocalBtn(a.id.replace('audio_','')); }
    });
    audio.play().catch(()=>{});
    if(btn) btn.textContent='⏸';
  } else {
    audio.pause();
    if(btn) btn.textContent='▶';
  }
}

function updateVocalBar(uid){
  const audio = document.getElementById('audio_'+uid);
  if(!audio||!audio.duration) return;

  const pct    = audio.currentTime / audio.duration;
  const played = Math.floor(pct * BAR_COUNT);

  const waveEl = document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(!waveEl) return;

  waveEl.querySelectorAll('.vocal-bar').forEach((bar, i) => {
    const h = bar.dataset.h || '14';  // ← lit depuis le DOM, jamais perdu
    bar.style.height = h + 'px';
    if(i < played)        bar.className = 'vocal-bar played';
    else if(i === played) bar.className = 'vocal-bar active';
    else                  bar.className = 'vocal-bar';
  });

  const dur = document.getElementById('dur_'+uid);
  if(dur){
    const s = Math.floor(audio.currentTime);
    dur.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }
}

function resetVocal(uid){
  resetVocalBtn(uid);
  const audio = document.getElementById('audio_'+uid);
  if(audio) audio.currentTime = 0;

  const waveEl = document.querySelector(`.vocal-waveform[data-uid="${uid}"]`);
  if(waveEl){
    waveEl.querySelectorAll('.vocal-bar').forEach(bar => {
      const h = bar.dataset.h || '14';  // ← lit depuis le DOM
      bar.style.height = h + 'px';
      bar.className    = 'vocal-bar';
    });
  }

  const dur = document.getElementById('dur_'+uid);
  if(dur) dur.textContent = '0:00';
}

function resetVocalBtn(uid){
  const audio = document.getElementById('audio_'+uid);
  const btn   = audio?.previousElementSibling;
  if(btn) btn.textContent = '▶';
}

function openMenu(event, idx){
  if(event) event.preventDefault();
  const m   = messages[idx]; if(!m) return;
  const isMe = String(m.from)===String(me.id);
  closeMenu();

  const overlay = document.createElement('div');
  overlay.className='ctx-overlay'; overlay.id='ctx-overlay';
  overlay.onclick=closeMenu;
  document.body.appendChild(overlay);

  const bubbleEl = document.getElementById('msg_'+m.msg_id);
  const rect     = bubbleEl?bubbleEl.getBoundingClientRect():{top:200,left:50,right:300,bottom:240};
  const windowH  = window.innerHeight;

  const emojiBar = document.createElement('div');
  emojiBar.className='ctx-emoji-bar'; emojiBar.id='ctx-emoji-bar';
  QUICK_EMOJIS.forEach(emoji=>{
    const btn=document.createElement('button'); btn.className='ctx-emoji-btn';
    btn.textContent=emoji;
    btn.onclick=()=>{ closeMenu(); toggleReaction(m.msg_id,emoji); };
    emojiBar.appendChild(btn);
  });
  document.body.appendChild(emojiBar);

  const menu = document.createElement('div');
  menu.className='ctx-menu'; menu.id='ctx-menu';

  const items = [
    {
      label:'Répondre',
      icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>`,
      action:()=>{
        closeMenu();
        replyingTo={msg_id:m.msg_id, from:m.from, text:m.text, media_type:m.media_type};
        const fromName=isMe?'Toi':friend.prenom;
        let txt=m.text||'';
        if(!txt){
          if(m.media_type==='image')  txt='📷 Photo';
          else if(m.media_type==='video') txt='🎥 Vidéo';
          else if(m.media_type==='audio') txt='🎵 Vocal';
        }
        document.getElementById('reply-bar-name').textContent=fromName;
        document.getElementById('reply-bar-text').textContent=txt;
        document.getElementById('reply-bar').classList.add('active');
        document.getElementById('reply-bar-cancel-btn').onclick=cancelReply;
        document.getElementById('msg-input').focus();
      }
    },
  ];

  if(isMe && !m.media_url && canEdit(m)){
    items.push({
      label:'Modifier',
      icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      action:()=>{ closeMenu(); startEdit(m.msg_id, m.text); }
    });
  }
  if(isMe){
    items.push({
      label:'Supprimer', danger:true,
      icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
      action:()=>{ closeMenu(); deleteMessage(m.msg_id); }
    });
  }

  items.forEach(item=>{
    const btn=document.createElement('button');
    btn.className='ctx-menu-item'+(item.danger?' danger':'');
    btn.innerHTML=`${item.icon}<span>${item.label}</span>`;
    btn.onclick=item.action;
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);

  requestAnimationFrame(()=>{
    const emojiH  = emojiBar.offsetHeight||60;
    const menuH   = menu.offsetHeight||160;
    const gap     = 8;
    const totalH  = emojiH+gap+menuH;
    const spBelow = windowH-rect.bottom;
    const spAbove = rect.top;
    let topPos;
    if(spBelow>totalH+20)      topPos=rect.bottom+10;
    else if(spAbove>totalH+20) topPos=rect.top-totalH-10;
    else                       topPos=Math.max(20,(windowH-totalH)/2);
    emojiBar.style.cssText+=`;top:${topPos}px;left:50%;transform:translateX(-50%)`;
    menu.style.cssText+=`;top:${topPos+emojiH+gap}px;left:50%;transform:translateX(-50%)`;
  });
}
function closeMenu(){

  document.getElementById('ctx-emoji-bar')?.remove();
  document.getElementById('ctx-menu')?.remove();
}

function canEdit(m){
  if(!m.created_at) return true;
  return (Date.now()-new Date(m.created_at).getTime()) < EDIT_LIMIT_MS;
}
function startEdit(msgId, currentText){
  editingMsgId=msgId;
  const input=document.getElementById('msg-input');
  input.value=currentText; input.focus();
  document.getElementById('reply-bar-icon').textContent='✏️';
  document.getElementById('reply-bar-name').textContent='Modifier le message';
  document.getElementById('reply-bar-text').textContent=currentText;
  document.getElementById('reply-bar').classList.add('active');
  document.getElementById('reply-bar-cancel-btn').onclick=cancelEdit;
  document.getElementById('send-btn').style.color='#e6a800';
}
function confirmEdit(){
  const input   = document.getElementById('msg-input');
  const newText = input.value.trim();
  if(!newText||!editingMsgId) return;
  const m=messages.find(m=>m.msg_id===editingMsgId);
  if(m&&!canEdit(m)){ showToast('Délai de 7 min dépassé'); cancelEdit(); return; }
  if(m){ m.text=newText; m.edited=true; }
  renderMessages();
  ws?.send(JSON.stringify({action:'edit_message', to:friend.id, msg_id:editingMsgId, text:newText}));
  cancelEdit();
}
function cancelEdit(){
  editingMsgId=null;
  document.getElementById('msg-input').value='';
  document.getElementById('reply-bar').classList.remove('active');
  document.getElementById('reply-bar-icon').textContent='↩';
  document.getElementById('reply-bar-cancel-btn').onclick=cancelReply;
  document.getElementById('send-btn').style.color='#f5c518';
}
function deleteMessage(msgId){
  ws?.send(JSON.stringify({action:'delete_message', to:friend.id, msg_id:msgId}));
  messages=messages.filter(m=>m.msg_id!==msgId); renderMessages();
}

function showToast(msg){
  document.getElementById('toast-el')?.remove();
  const t=document.createElement('div'); t.id='toast-el'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2500);
}

// ════════════════════════════════════════════
// ENVOYER
// ════════════════════════════════════════════
function sendMessage(){
  if(editingMsgId){ confirmEdit(); return; }
  const input = document.getElementById('msg-input');
  const text  = input.value.trim(); if(!text) return;
  const now    = new Date();
  const time   = now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
  const tempId = `temp_${me.id}_${Date.now()}`;
  messages.push({
    from: String(me.id), text,
    media_url:null, media_type:null,
    is_vocal:false, edited:false,
    time, msg_id:tempId,
    created_at: new Date().toISOString(),
    is_forwarded:false, forwarded_from:null, reactions:[],
    reply_to_id:   replyingTo?.msg_id||null,
    reply_to_text: replyingTo?.text||null,
    reply_to_type: replyingTo?.media_type||null,
    reply_to_from: replyingTo?.from||null,
  });
  seen=false; renderMessages(); input.value='';
  ws?.send(JSON.stringify({
    action:'send_message', to:friend.id, temp_id:tempId, text,
    reply_to_id:   replyingTo?.msg_id||null,
    reply_to_text: replyingTo?.text||null,
    reply_to_type: replyingTo?.media_type||null,
    reply_to_from: replyingTo?.from||null,
  }));
  cancelReply(); clearTypingState();
}

// ════════════════════════════════════════════
// UPLOAD
// ════════════════════════════════════════════
async function uploadAndSend(file, isVocal=false){
  document.getElementById('upload-overlay').classList.add('active');
  document.getElementById('send-btn').disabled=true;
  try{
    const fd=new FormData(); fd.append('file',file);
    const res=await fetch(`${API}/upload`,{method:'POST',body:fd});
    const data=await res.json();
    if(!data.url){ alert('Erreur upload'); return; }
    const now=new Date(), time=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0');
    const tempId=`temp_${me.id}_${Date.now()}`;
    messages.push({
      from:String(me.id), text:'', media_url:data.url, media_type:data.media_type,
      is_vocal:isVocal, edited:false, time, msg_id:tempId,
      created_at:new Date().toISOString(),
      is_forwarded:false, forwarded_from:null, reactions:[],
      reply_to_id:replyingTo?.msg_id||null, reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null, reply_to_from:replyingTo?.from||null,
    });
    seen=false; renderMessages();
    ws?.send(JSON.stringify({
      action:'send_message', to:friend.id, temp_id:tempId,
      text:'', media_url:data.url, media_type:data.media_type, is_vocal:isVocal,
      reply_to_id:replyingTo?.msg_id||null, reply_to_text:replyingTo?.text||null,
      reply_to_type:replyingTo?.media_type||null, reply_to_from:replyingTo?.from||null,
    }));
    cancelReply();
  }catch(e){ alert('Erreur réseau'); }
  finally{
    document.getElementById('upload-overlay').classList.remove('active');
    document.getElementById('send-btn').disabled=false;
  }
}
function pickMedia(){ document.getElementById('file-media').click(); }
function handleFile(input){ if(input.files[0]){ uploadAndSend(input.files[0]); input.value=''; } }

// ════════════════════════════════════════════
// VOCAL ENREGISTREMENT
// ════════════════════════════════════════════
let mediaRecorder=null, audioChunks=[], recordingStream=null;
let recTimerInterval=null, recSeconds=0, recWaveInterval=null;
let pendingBlob=null, pendingBlobUrl=null, previewAudio=null;
let recState='idle', wavePhase=0;

function initRecWaveform(){
  const waveEl=document.getElementById('rec-waveform');
  waveEl.innerHTML='';
  for(let i=0;i<40;i++){
    const bar=document.createElement('div');
    bar.className='rec-bar';
    bar.style.height='4px';
    waveEl.appendChild(bar);
  }
  wavePhase=0;
}

function animateRecWaveform(){
  if(recState!=='recording') return;
  wavePhase += 0.15;
  const bars=document.querySelectorAll('.rec-bar');
  bars.forEach((bar,i)=>{
    // Vague douce : 2 sinus superposés
    const v1 = Math.sin(wavePhase + i * 0.35) * 0.5 + 0.5;
    const v2 = Math.sin(wavePhase * 0.7 + i * 0.6) * 0.25;
    const v  = Math.max(0.05, Math.min(1, v1 + v2));
    bar.style.height    = Math.round(4 + v * 26) + 'px';
    bar.style.background= `rgba(0,0,0,${(0.3 + v * 0.5).toFixed(2)})`;
  });
}

async function startRecording(e){
  if(e) e.preventDefault();
  if(recState!=='idle') return;
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mimeType=MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':
                   MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
    mediaRecorder=mimeType
      ?new MediaRecorder(recordingStream,{mimeType})
      :new MediaRecorder(recordingStream);
    audioChunks=[]; recSeconds=0; pendingBlob=null; pendingBlobUrl=null;
    mediaRecorder.ondataavailable=e=>{if(e.data.size>0) audioChunks.push(e.data);};
    mediaRecorder.onstop=()=>{
      recordingStream.getTracks().forEach(t=>t.stop());
      const finalType=mediaRecorder.mimeType||'audio/webm';
      const finalExt =finalType.includes('mp4')?'mp4':'webm';
      pendingBlob=new Blob(audioChunks,{type:finalType});
      pendingBlob._ext=finalExt; pendingBlob._type=finalType;
      if(pendingBlobUrl) URL.revokeObjectURL(pendingBlobUrl);
      pendingBlobUrl=URL.createObjectURL(pendingBlob);
      startPreview();
    };
    mediaRecorder.start(100);
    recState='recording';
    initRecWaveform();
    document.getElementById('vocal-recording-bar').classList.add('active');
    document.getElementById('vocal-recording-actions').classList.add('active');
    document.getElementById('input-row').style.display='none';
    document.getElementById('rec-pause-btn').textContent='⏸';
    recTimerInterval=setInterval(()=>{
      if(recState==='recording'){
        recSeconds++;
        const m=Math.floor(recSeconds/60), s=recSeconds%60;
        document.getElementById('rec-timer').textContent=`${m}:${String(s).padStart(2,'0')}`;
      }
    },1000);
    recWaveInterval=setInterval(animateRecWaveform, 50); // 20fps fluide
  }catch(e){ alert('Accès au microphone refusé.'); }
}

function onMicRelease(){}

function togglePausePlay(){
  const btn=document.getElementById('rec-pause-btn');
  if(recState==='recording'){
    clearInterval(recTimerInterval); clearInterval(recWaveInterval);
    mediaRecorder.stop(); btn.textContent='⏳';
  } else if(recState==='preview_playing'){
    previewAudio?.pause();
    clearInterval(window._previewInterval);
    recState='preview_paused'; btn.textContent='▶';
  } else if(recState==='preview_paused'){
    // Relancer startPreview depuis le début
    startPreview();
  }
}

function startPreview(){
  if(!pendingBlobUrl) return;
  const btn=document.getElementById('rec-pause-btn');

  // Arrêter l'ancien audio si existant
  if(previewAudio){ previewAudio.pause(); previewAudio.onended=null; previewAudio=null; }
  clearInterval(window._previewInterval);

  // Barres fixes pour toute la session
  if(!window._previewBars){
    window._previewBars = generateWaveBars('preview_fixed', 40);
  }
  const previewBars = window._previewBars;
  const waveEl = document.getElementById('rec-waveform');

  // Afficher les barres immédiatement
  waveEl.querySelectorAll('.rec-bar').forEach((bar, i) => {
    bar.style.height     = (previewBars[i] || 8) + 'px';
    bar.style.background = 'rgba(255,255,255,.4)';
  });

  previewAudio = new Audio(pendingBlobUrl);
  recState='preview_playing'; btn.textContent='⏸';

  previewAudio.play().then(()=>{
    // Lancer l'animation
    window._previewInterval = setInterval(()=>{
      if(!previewAudio || previewAudio.paused){
        clearInterval(window._previewInterval);
        return;
      }
      const dur    = previewAudio.duration || 1;
      const pct    = previewAudio.currentTime / dur;
      const played = Math.floor(pct * 40);

      waveEl.querySelectorAll('.rec-bar').forEach((bar, i) => {
        bar.style.height     = (previewBars[i] || 8) + 'px';
        bar.style.background = i < played
          ? 'rgba(255,255,255,.95)'
          : 'rgba(255,255,255,.4)';
      });

      const s = Math.floor(previewAudio.currentTime);
      document.getElementById('rec-timer').textContent =
        `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    }, 50);

    previewAudio.onended = () => {
      clearInterval(window._previewInterval);
      recState='preview_paused'; btn.textContent='▶';
      // Restaurer toutes les barres à leur hauteur
      waveEl.querySelectorAll('.rec-bar').forEach((bar, i) => {
        bar.style.height     = (previewBars[i] || 8) + 'px';
        bar.style.background = 'rgba(255,255,255,.4)';
      });
      document.getElementById('rec-timer').textContent = '0:00';
    };

  }).catch(()=>{
    recState='preview_paused'; btn.textContent='▶';
  });
}
function hideRecordingBar(){
  clearInterval(window._previewInterval);
  if(previewAudio){ previewAudio.pause(); previewAudio.onended=null; previewAudio=null; }
  clearInterval(recTimerInterval); clearInterval(recWaveInterval);
  document.getElementById('vocal-recording-bar').classList.remove('active');
  document.getElementById('vocal-recording-actions').classList.remove('active');
  document.getElementById('input-row').style.display='flex';
  document.getElementById('rec-timer').textContent='0:00';
  document.getElementById('rec-pause-btn').textContent='⏸';
  recState='idle';
  window._previewBars = null; // ← reset pour le prochain enregistrement
  if(pendingBlobUrl){ URL.revokeObjectURL(pendingBlobUrl); pendingBlobUrl=null; }
}

async function sendRecording(){
  clearInterval(window._previewInterval);
  if(previewAudio){ previewAudio.pause(); previewAudio.onended=null; previewAudio=null; }
  if(recState==='recording'&&mediaRecorder&&mediaRecorder.state!=='inactive'){
    clearInterval(recTimerInterval); clearInterval(recWaveInterval);
    await new Promise(resolve=>{
      const orig=mediaRecorder.onstop;
      mediaRecorder.onstop=(...args)=>{ orig?.(...args); resolve(); };
      mediaRecorder.stop(); recordingStream?.getTracks().forEach(t=>t.stop());
    });
    await new Promise(r=>setTimeout(r,150));
  }
  hideRecordingBar();
  if(!pendingBlob||pendingBlob.size<500) return;
  const blob=pendingBlob; pendingBlob=null;
  const file=new File([blob],`vocal_${Date.now()}.${blob._ext}`,{type:blob._type});
  await uploadAndSend(file,true);
}

function cancelRecording(){
  clearInterval(window._previewInterval);
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){
    mediaRecorder.onstop=()=>{};
    mediaRecorder.stop(); recordingStream?.getTracks().forEach(t=>t.stop());
  }
  pendingBlob=null; hideRecordingBar();
}

// ── Typing ──
function onTyping(text){
  if(editingMsgId) return;
  if(!text){
    ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));
    isTypingSent=false; clearTimeout(typingTimer); return;
  }
  if(!isTypingSent){
    ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:true}));
    isTypingSent=true;
  }
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>{
    ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));
    isTypingSent=false;
  },2000);
}
function clearTypingState(){
  clearTimeout(typingTimer);
  ws?.send(JSON.stringify({action:'typing',to:friend.id,is_typing:false}));
  isTypingSent=false;
}
function showTyping(isTyping){
  document.getElementById('chat-typing').style.display=isTyping?'block':'none';
  const area=document.getElementById('messages-area');
  let tb=document.getElementById('typing-bubble');
  if(isTyping&&!tb){
    tb=document.createElement('div'); tb.id='typing-bubble'; tb.className='typing-bubble';
    tb.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    area.appendChild(tb); area.scrollTop=area.scrollHeight;
  } else if(!isTyping&&tb) tb.remove();
}
function onKey(e){ if(e.key==='Enter') sendMessage(); }
