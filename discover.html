<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Découvrir - NikahConnect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;}
body{display:flex;justify-content:center;background:linear-gradient(135deg,#ffffff 0%,#fffde7 50%,#fff9c4 100%);min-height:100vh;}

.shell{
  width:100%;max-width:480px;
  height:100vh;
  display:flex;flex-direction:column;
  position:relative;
  overflow:hidden;
}

.topbar{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-logo{font-size:20px;font-weight:800;color:#1a1a1a;letter-spacing:-.5px;}
.topbar-logo span{color:#f5c518;}
.topbar-actions{display:flex;gap:10px;}
.topbar-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.08);transition:.2s;}
.topbar-btn:active{transform:scale(.93);}
.topbar-btn svg{width:20px;height:20px;}

.cards-stack{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;padding:0 12px;margin-bottom:0;
  overflow:hidden;min-height:0;
}

.card-wrap{position:absolute;width:calc(100% - 24px);max-width:448px;transition:transform .3s ease,opacity .3s ease;}
.card-wrap.card-back-2{transform:scale(.92) translateY(16px);z-index:1;}
.card-wrap.card-back-1{transform:scale(.96) translateY(8px);z-index:2;}
.card-wrap.card-front{z-index:3;transform:scale(1) translateY(0);}
.card-wrap.swipe-left{transform:translateX(-130%) rotate(-20deg)!important;opacity:0;transition:transform .4s ease,opacity .3s ease;}
.card-wrap.swipe-right{transform:translateX(130%) rotate(20deg)!important;opacity:0;transition:transform .4s ease,opacity .3s ease;}

.profile-card{
  border-radius:28px;overflow:hidden;background:#f0f0f0;
  box-shadow:0 12px 50px rgba(0,0,0,.18),0 4px 16px rgba(0,0,0,.08);
  position:relative;width:100%;
  aspect-ratio:3/4;
  max-height:calc(100vh - 220px);
  min-height:360px;user-select:none;
}

.photo-gallery{position:relative;height:100%;width:100%;}
.photo-slide{position:absolute;inset:0;opacity:0;transition:opacity .4s ease;}
.photo-slide.active{opacity:1;}
.photo-slide img{
  width:100%;height:100%;
  object-fit:cover;object-position:center center;
  display:block;will-change:opacity;
}

.photo-bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:10;}
.photo-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.4);overflow:hidden;}
.photo-bar-fill{height:100%;background:#fff;border-radius:2px;transition:width .3s;}

.photo-nav-left{position:absolute;left:0;top:0;width:40%;height:100%;z-index:9;cursor:pointer;}
.photo-nav-right{position:absolute;right:0;top:0;width:40%;height:100%;z-index:9;cursor:pointer;}

.card-overlay{
  position:absolute;bottom:0;left:0;right:0;z-index:10;
  padding:60px 20px 28px;
  background:linear-gradient(to top,rgba(0,0,0,.80) 0%,rgba(0,0,0,.35) 50%,transparent 100%);
  border-radius:0 0 28px 28px;
}
.card-name{font-size:26px;font-weight:800;color:#fff;line-height:1.1;}
.card-name span{font-size:20px;font-weight:400;opacity:.85;}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.card-tag{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:5px 10px;font-size:12px;color:#fff;font-weight:500;}
.card-desc{font-size:13px;color:rgba(255,255,255,.8);margin-top:10px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.expand-btn{position:absolute;bottom:24px;right:20px;z-index:11;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.expand-btn svg{width:16px;height:16px;stroke:#fff;}

.like-indicator,.nope-indicator{position:absolute;top:40px;z-index:20;padding:8px 18px;border-radius:8px;font-size:26px;font-weight:900;letter-spacing:2px;opacity:0;transition:opacity .15s;border:3px solid;}
.like-indicator{left:20px;color:#4ade80;border-color:#4ade80;transform:rotate(-15deg);}
.nope-indicator{right:20px;color:#f87171;border-color:#f87171;transform:rotate(15deg);}

.actions-row{
  display:flex;align-items:center;justify-content:center;
  gap:16px;padding:10px 20px 14px;flex-shrink:0;
}
.action-btn{border:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s;box-shadow:0 4px 16px rgba(0,0,0,.1);}
.action-btn:active{transform:scale(.9);}
.btn-pass{width:58px;height:58px;background:#fff;box-shadow:0 4px 16px rgba(248,113,113,.2);}
.btn-pass svg{width:26px;height:26px;stroke:#f87171;}
.btn-superlike{width:48px;height:48px;background:#fff;box-shadow:0 4px 16px rgba(96,165,250,.2);}
.btn-superlike svg{width:22px;height:22px;stroke:#60a5fa;}
.btn-like{width:58px;height:58px;background:linear-gradient(135deg,#f5c518,#ffe066);box-shadow:0 4px 16px rgba(245,197,24,.4);}
.btn-like svg{width:26px;height:26px;stroke:#1a1a1a;fill:#1a1a1a;}
.btn-undo{width:40px;height:40px;background:#fff;}
.btn-undo svg{width:18px;height:18px;stroke:#aaa;}

.navbar{display:flex;padding:10px 0 20px;border-top:1px solid rgba(0,0,0,.06);background:rgba(255,255,255,.8);backdrop-filter:blur(20px);flex-shrink:0;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;}
.nav-item svg{width:24px;height:24px;stroke:#ccc;transition:.2s;}
.nav-item.active svg{stroke:#f5c518;}
.nav-label{font-size:10px;color:#ccc;font-weight:600;}
.nav-item.active .nav-label{color:#f5c518;}
.nav-badge{position:relative;}
.badge{position:absolute;top:-4px;right:-6px;background:#f5c518;color:#1a1a1a;font-size:9px;font-weight:800;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

.empty-state{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px 20px;text-align:center;}
.empty-state.show{display:flex;}
.empty-icon{width:80px;height:80px;background:linear-gradient(135deg,#f5c518,#ffe066);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.empty-icon svg{width:40px;height:40px;}
.empty-state h3{font-size:20px;font-weight:700;color:#1a1a1a;margin-bottom:8px;}
.empty-state p{font-size:14px;color:#aaa;margin-bottom:24px;}
.btn-refresh{padding:14px 32px;background:linear-gradient(135deg,#f5c518,#ffe066);border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(245,197,24,.4);}

.match-overlay{
  display:none;position:fixed;top:0;bottom:0;
  left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(0,0,0,.7);z-index:200;
  align-items:center;justify-content:center;flex-direction:column;
}
.match-overlay.show{display:flex;}
.match-title{font-size:38px;font-weight:900;background:linear-gradient(135deg,#f5c518,#ffe066);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;text-align:center;}
.match-sub{font-size:16px;color:rgba(255,255,255,.7);margin-bottom:32px;text-align:center;}
.match-avatars{display:flex;align-items:center;gap:16px;margin-bottom:36px;}
.match-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #f5c518;}
.match-heart{font-size:28px;}
.btn-match-msg{padding:16px 40px;background:linear-gradient(135deg,#f5c518,#ffe066);border:none;border-radius:50px;font-size:16px;font-weight:700;color:#1a1a1a;cursor:pointer;box-shadow:0 4px 24px rgba(245,197,24,.5);margin-bottom:14px;}
.btn-match-skip{background:none;border:none;color:rgba(255,255,255,.5);font-size:14px;cursor:pointer;padding:8px;}

.profile-sheet{
  position:fixed;top:0;bottom:0;
  left:50%;transform:translateX(-50%) translateY(100%);
  width:100%;max-width:480px;
  background:#fff;z-index:150;overflow-y:auto;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.profile-sheet.open{transform:translateX(-50%) translateY(0);}
.sheet-header{position:relative;}
.sheet-photos{
  width:100%;aspect-ratio:3/4;
  max-height:75vh;position:relative;overflow:hidden;
}
.sheet-photo{position:absolute;inset:0;opacity:0;transition:opacity .4s;}
.sheet-photo.active{opacity:1;}
.sheet-photo img{width:100%;height:100%;object-fit:cover;object-position:center center;}
.sheet-photo-bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:5;}
.sheet-photo-bar{flex:1;height:3px;background:rgba(255,255,255,.4);border-radius:2px;overflow:hidden;}
.sheet-photo-bar-fill{height:100%;background:#fff;border-radius:2px;}
.sheet-close{position:absolute;top:16px;right:16px;z-index:10;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sheet-close svg{width:18px;height:18px;stroke:#fff;}
.sheet-nav-l{position:absolute;left:0;top:0;width:35%;height:100%;z-index:4;cursor:pointer;}
.sheet-nav-r{position:absolute;right:0;top:0;width:35%;height:100%;z-index:4;cursor:pointer;}
.sheet-body{padding:24px 20px 40px;}
.sheet-name{font-size:28px;font-weight:800;color:#1a1a1a;}
.sheet-name span{font-size:22px;font-weight:400;color:#666;}
.infos-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0;}
.info-card{background:linear-gradient(135deg,#fffde7,#fff9c4);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;}
.info-card-label{font-size:10px;font-weight:700;color:#aaa;letter-spacing:.5px;}
.info-card-value{font-size:14px;font-weight:600;color:#1a1a1a;}
.info-card-icon{font-size:18px;margin-bottom:2px;}
.sheet-desc-title{font-size:13px;font-weight:700;color:#aaa;letter-spacing:.5px;margin-bottom:8px;}
.sheet-desc{font-size:15px;color:#333;line-height:1.7;}
.sheet-actions{display:flex;gap:12px;margin-top:28px;}
.sheet-btn-pass{flex:1;padding:15px;border:1.5px solid #eee;border-radius:14px;background:#fff;font-size:15px;font-weight:700;color:#f87171;cursor:pointer;}
.sheet-btn-like{flex:2;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#f5c518,#ffe066);font-size:15px;font-weight:700;color:#1a1a1a;cursor:pointer;box-shadow:0 4px 12px rgba(245,197,24,.4);}

.loader{display:flex;align-items:center;justify-content:center;flex:1;}
.spinner{width:40px;height:40px;border:3px solid #eee;border-top-color:#f5c518;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-logo">Nikah<span>Connect</span></div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="location.href='profile.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </button>
    </div>
  </div>

  <div class="loader" id="loader"><div class="spinner"></div></div>
  <div class="cards-stack" id="cards-stack" style="display:none;"></div>

  <div class="empty-state" id="empty-state">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </div>
    <h3>Plus de profils pour l'instant</h3>
    <p>Revenez plus tard ou actualisez pour découvrir de nouvelles personnes</p>
    <button class="btn-refresh" onclick="loadProfiles(true)">Actualiser</button>
  </div>

  <div class="actions-row" id="actions-row" style="display:none;">
    <button class="action-btn btn-undo" onclick="undoLast()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="action-btn btn-pass" onclick="swipe('left')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="action-btn btn-superlike" onclick="swipe('superlike')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
    <button class="action-btn btn-like" onclick="swipe('right')">
      <svg viewBox="0 0 24 24" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </button>
  </div>

  <nav class="navbar">
    <a class="nav-item active" href="discover.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span class="nav-label">Découvrir</span>
    </a>
    <a class="nav-item" href="matches.html">
      <div class="nav-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <span class="nav-label">Matchs</span>
    </a>
    <a class="nav-item" href="messages.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-label">Messages</span>
    </a>
    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      <span class="nav-label">Profil</span>
    </a>
  </nav>
</div>

<!-- Match popup -->
<div class="match-overlay" id="match-overlay">
  <div class="match-title">C'est un Match ! 💛</div>
  <div class="match-sub">Vous vous êtes plu mutuellement</div>
  <div class="match-avatars">
    <img class="match-avatar" id="match-me-photo" src="" alt=""/>
    <div class="match-heart">💛</div>
    <img class="match-avatar" id="match-other-photo" src="" alt=""/>
  </div>
  <button class="btn-match-msg" onclick="goToMatch()">Envoyer un message</button>
  <button class="btn-match-skip" onclick="closeMatch()">Continuer à explorer</button>
</div>

<!-- Profil détaillé -->
<div class="profile-sheet" id="profile-sheet">
  <div class="sheet-header">
    <div class="sheet-photos" id="sheet-photos">
      <div class="sheet-photo-bars" id="sheet-photo-bars"></div>
      <div class="sheet-nav-l" onclick="sheetPrevPhoto()"></div>
      <div class="sheet-nav-r" onclick="sheetNextPhoto()"></div>
    </div>
    <button class="sheet-close" onclick="closeSheet()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<script>
const API = "http://161.97.172.249:8000";
const me  = JSON.parse(localStorage.getItem('me'));
if(!me) window.location.href = 'index.html';

let profiles=[], currentIdx=0, sheetPhotoIdx=0, cardPhotoIdx=0;
let matchedUser=null, lastAction=null;
let isDragging=false, dragStartX=0, dragCurrentX=0;
let currentOffset=0, hasMore=true, isLoadingMore=false;

// ════════════════════════════════
// LOAD
// ════════════════════════════════
async function loadProfiles(reset=true){
  if(reset){
    currentOffset=0; profiles=[]; hasMore=true;
    document.getElementById('loader').style.display      = 'flex';
    document.getElementById('cards-stack').style.display = 'none';
    document.getElementById('actions-row').style.display = 'none';
    document.getElementById('empty-state').classList.remove('show');
  }
  if(!hasMore || isLoadingMore) return;
  isLoadingMore=true;
  try{
    const res  = await fetch(`${API}/discover/${me.id}?offset=${currentOffset}`);
    const data = await res.json();
    const newProfiles = data.profiles || [];
    hasMore           = data.has_more || false;
    currentOffset    += newProfiles.length;
    if(reset){ profiles=newProfiles; currentIdx=0; }
    else      { profiles=[...profiles, ...newProfiles]; }
    renderStack();
  }catch(e){ console.error(e); }
  isLoadingMore=false;
  document.getElementById('loader').style.display='none';
}

// ════════════════════════════════
// RENDER STACK
// ════════════════════════════════
function renderStack(){
  const stack=document.getElementById('cards-stack');
  stack.innerHTML=''; cardPhotoIdx=0;
  const remaining=profiles.slice(currentIdx);

  // Charger plus en arrière-plan si < 5 profils restants
  if(remaining.length<=5 && hasMore && !isLoadingMore){
    loadProfiles(false);
  }

  if(!remaining.length){
    if(hasMore){
      document.getElementById('loader').style.display='flex';
      return;
    }
    document.getElementById('empty-state').classList.add('show');
    document.getElementById('actions-row').style.display='none';
    return;
  }

  document.getElementById('loader').style.display     ='none';
  document.getElementById('cards-stack').style.display='flex';
  document.getElementById('actions-row').style.display='flex';

  const visible=remaining.slice(0,3).reverse();
  visible.forEach((p,i)=>{
    const isTop=i===visible.length-1;
    const wrap =buildCard(p,isTop);
    const cls  =['card-back-2','card-back-1','card-front'];
    wrap.classList.add(cls[i+(3-visible.length)]);
    stack.appendChild(wrap);
  });
  if(remaining.length>0) setupDrag();
}

// ════════════════════════════════
// BUILD CARD
// ════════════════════════════════
function buildCard(p,isTop){
  const photos=p.photos?.length?p.photos:['https://via.placeholder.com/400x560/fffde7/f5c518?text=?'];
  const wrap=document.createElement('div');
  wrap.className='card-wrap'; wrap.id='card-'+p.id;

  const slidesHTML=photos.map((ph,i)=>
    `<div class="photo-slide ${i===0?'active':''}" id="slide-${p.id}-${i}">
      <img src="${ph}" alt="" draggable="false"/>
    </div>`).join('');

  const barsHTML=photos.map((_,i)=>
    `<div class="photo-bar"><div class="photo-bar-fill" id="bar-${p.id}-${i}" style="width:${i===0?'100':'0'}%"></div></div>`
  ).join('');

  const tags=[];
  if(p.age)           tags.push({icon:'🎂',text:p.age+' ans'});
  if(p.ville)         tags.push({icon:'📍',text:p.ville});
  if(p.profession)    tags.push({icon:'💼',text:p.profession});
  if(p.religion)      tags.push({icon:'🕌',text:p.religion});
  if(p.niveau_etudes) tags.push({icon:'🎓',text:p.niveau_etudes});
  const tagsHTML=tags.slice(0,4).map(t=>`<div class="card-tag"><span>${t.icon}</span><span>${t.text}</span></div>`).join('');

  wrap.innerHTML=`
    <div class="profile-card">
      <div class="photo-gallery">
        <div class="photo-bars">${barsHTML}</div>
        ${slidesHTML}
        <div class="like-indicator" id="like-${p.id}">LIKE</div>
        <div class="nope-indicator" id="nope-${p.id}">NOPE</div>
        ${isTop?`<div class="photo-nav-left" onclick="cardPrevPhoto(${p.id},${photos.length})"></div>
                 <div class="photo-nav-right" onclick="cardNextPhoto(${p.id},${photos.length})"></div>`:''}
      </div>
      <div class="card-overlay">
        <div class="card-name">${p.prenom} <span>${p.age||''}</span></div>
        <div class="card-tags">${tagsHTML}</div>
        ${p.description?`<div class="card-desc">${p.description}</div>`:''}
      </div>
      ${isTop?`<div class="expand-btn" onclick="openSheet(${p.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
      </div>`:''}
    </div>`;
  return wrap;
}

// ════════════════════════════════
// CARD PHOTOS NAV
// ════════════════════════════════
function cardNextPhoto(pid,total){ cardPhotoIdx=Math.min(cardPhotoIdx+1,total-1); updateCardPhoto(pid,total); }
function cardPrevPhoto(pid,total){ cardPhotoIdx=Math.max(cardPhotoIdx-1,0); updateCardPhoto(pid,total); }
function updateCardPhoto(pid,total){
  for(let i=0;i<total;i++){
    document.getElementById(`slide-${pid}-${i}`)?.classList.toggle('active',i===cardPhotoIdx);
    const br=document.getElementById(`bar-${pid}-${i}`);
    if(br) br.style.width=i<=cardPhotoIdx?'100%':'0%';
  }
}

// ════════════════════════════════
// DRAG
// ════════════════════════════════
function setupDrag(){
  const p=profiles[currentIdx]; if(!p) return;
  const el=document.getElementById('card-'+p.id); if(!el) return;
  if(window._dragController) window._dragController.abort();
  window._dragController=new AbortController();
  const sig=window._dragController.signal;
  el.addEventListener('mousedown', e=>{e.preventDefault();startDrag(e.clientX);},{signal:sig});
  el.addEventListener('touchstart',e=>startDrag(e.touches[0].clientX),{passive:true,signal:sig});
  document.addEventListener('mousemove', e=>onDrag(e.clientX),{signal:sig});
  document.addEventListener('touchmove', e=>onDrag(e.touches[0].clientX),{passive:true,signal:sig});
  document.addEventListener('mouseup',   endDrag,{signal:sig});
  document.addEventListener('touchend',  endDrag,{signal:sig});
  document.addEventListener('mouseleave',endDrag,{signal:sig});
}

function startDrag(x){ isDragging=true; dragStartX=x; dragCurrentX=x; }

function onDrag(x){
  if(!isDragging) return;
  dragCurrentX=x;
  const diff=dragCurrentX-dragStartX;
  const p=profiles[currentIdx]; if(!p) return;
  const el=document.getElementById('card-'+p.id); if(!el) return;
  el.style.transition='none';
  el.style.transform=`translateX(${diff}px) rotate(${diff*0.08}deg)`;
  const likeEl=document.getElementById('like-'+p.id);
  const nopeEl=document.getElementById('nope-'+p.id);
  if(likeEl) likeEl.style.opacity=diff>20?Math.min((diff-20)/60,1):0;
  if(nopeEl) nopeEl.style.opacity=diff<-20?Math.min((-diff-20)/60,1):0;
}

function endDrag(){
  if(!isDragging) return;
  isDragging=false;
  const diff=dragCurrentX-dragStartX;
  if(diff>80) swipe('right');
  else if(diff<-80) swipe('left');
  else resetCard();
}

function resetCard(){
  const p=profiles[currentIdx]; if(!p) return;
  const el=document.getElementById('card-'+p.id); if(!el) return;
  el.style.transition='transform .3s ease';
  el.style.transform='';
  document.getElementById('like-'+p.id)?.style.setProperty('opacity','0');
  document.getElementById('nope-'+p.id)?.style.setProperty('opacity','0');
}

// ════════════════════════════════
// SWIPE
// ════════════════════════════════
async function swipe(dir){
  const p=profiles[currentIdx]; if(!p) return;
  const el=document.getElementById('card-'+p.id); if(!el) return;
  lastAction={profile:p,idx:currentIdx};
  el.style.transition='';
  el.classList.add(dir==='right'||dir==='superlike'?'swipe-right':'swipe-left');
  const type=dir==='superlike'?'superlike':dir==='right'?'like':'pass';
  setTimeout(async()=>{
    currentIdx++; cardPhotoIdx=0; renderStack();
    if(type!=='pass'){
      try{
        const res=await fetch(`${API}/like`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({from_user:me.id,to_user:p.id,type})
        });
        const data=await res.json();
        if(data.match) showMatch(p);
      }catch(e){}
    } else {
      // Enregistrer le pass aussi pour ne plus revoir
      try{
        await fetch(`${API}/like`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({from_user:me.id,to_user:p.id,type:'pass'})
        });
      }catch(e){}
    }
  },380);
}

function undoLast(){
  if(!lastAction) return;
  currentIdx=lastAction.idx; lastAction=null; cardPhotoIdx=0; renderStack();
}

// ════════════════════════════════
// MATCH
// ════════════════════════════════
function showMatch(p){
  matchedUser=p;
  document.getElementById('match-me-photo').src    = me.photos?.[0]||'';
  document.getElementById('match-other-photo').src = p.photos?.[0]||'';
  document.getElementById('match-overlay').classList.add('show');
}
function closeMatch(){ document.getElementById('match-overlay').classList.remove('show'); }
function goToMatch(){
  if(!matchedUser) return;
  localStorage.setItem('currentMatch',JSON.stringify(matchedUser));
  window.location.href='chat.html';
}

// ════════════════════════════════
// PROFILE SHEET
// ════════════════════════════════
function openSheet(pid){
  const p=profiles.find(x=>x.id===pid); if(!p) return;
  sheetPhotoIdx=0;
  const photos=p.photos?.length?p.photos:['https://via.placeholder.com/400x560/fffde7/f5c518?text=?'];
  const photosEl=document.getElementById('sheet-photos');
  const barsEl  =document.getElementById('sheet-photo-bars');
  photosEl.querySelectorAll('.sheet-photo').forEach(el=>el.remove());
  photos.forEach((ph,i)=>{
    const div=document.createElement('div');
    div.className=`sheet-photo ${i===0?'active':''}`;
    div.id=`sph-${i}`;
    div.innerHTML=`<img src="${ph}" alt=""/>`;
    photosEl.appendChild(div);
  });
  barsEl.innerHTML=photos.map((_,i)=>
    `<div class="sheet-photo-bar"><div class="sheet-photo-bar-fill" id="spbar-${i}" style="width:${i===0?'100':'0'}%"></div></div>`
  ).join('');
  const tags=[
    {label:'Âge',        icon:'🎂', value:p.age?p.age+' ans':null},
    {label:'Ville',      icon:'📍', value:p.ville||null},
    {label:'Pays',       icon:'🌍', value:p.pays||null},
    {label:'Profession', icon:'💼', value:p.profession||null},
    {label:'Religion',   icon:'🕌', value:p.religion||null},
    {label:'Études',     icon:'🎓', value:p.niveau_etudes||null},
  ].filter(t=>t.value);
  document.getElementById('sheet-body').innerHTML=`
    <div class="sheet-name">${p.prenom} <span>${p.nom||''}</span></div>
    <div class="infos-grid">
      ${tags.map(t=>`
        <div class="info-card">
          <div class="info-card-icon">${t.icon}</div>
          <div class="info-card-label">${t.label.toUpperCase()}</div>
          <div class="info-card-value">${t.value}</div>
        </div>`).join('')}
    </div>
    ${p.description?`<div class="sheet-desc-title">À PROPOS</div><div class="sheet-desc">${p.description}</div>`:''}
    <div class="sheet-actions">
      <button class="sheet-btn-pass" onclick="closeSheet();swipe('left')">✕ Passer</button>
      <button class="sheet-btn-like" onclick="closeSheet();swipe('right')">💛 J'aime</button>
    </div>`;
  document.getElementById('profile-sheet').classList.add('open');
}

function closeSheet(){ document.getElementById('profile-sheet').classList.remove('open'); }

function sheetNextPhoto(){
  const photos=profiles.find(p=>p.id===profiles[currentIdx]?.id)?.photos||[];
  sheetPhotoIdx=Math.min(sheetPhotoIdx+1,photos.length-1);
  updateSheetPhoto(photos.length);
}
function sheetPrevPhoto(){
  sheetPhotoIdx=Math.max(sheetPhotoIdx-1,0);
  const photos=profiles.find(p=>p.id===profiles[currentIdx]?.id)?.photos||[];
  updateSheetPhoto(photos.length);
}
function updateSheetPhoto(total){
  for(let i=0;i<total;i++){
    document.getElementById('sph-'+i)?.classList.toggle('active',i===sheetPhotoIdx);
    const br=document.getElementById('spbar-'+i);
    if(br) br.style.width=i<=sheetPhotoIdx?'100%':'0%';
  }
}

loadProfiles(true);
